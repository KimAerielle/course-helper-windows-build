name: Build Course Helper for Windows

on:
  push:
    paths:
      - '.github/workflows/build-windows.yml'
      - 'patches/**'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Upstream branch, tag, or commit to build
        required: true
        default: 9df279e8558975777c9c686f5b07bc174ef6054f
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - name: Check out upstream source
        uses: actions/checkout@v4
        with:
          repository: AneryCoft/course_helper
          ref: ${{ inputs.source_ref || '9df279e8558975777c9c686f5b07bc174ef6054f' }}
          path: source
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true

      - name: Record source and toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          git rev-parse HEAD | Set-Content ../source-commit.txt
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify source commit.' }
          flutter --version
          if ($LASTEXITCODE -ne 0) { throw 'Flutter is unavailable.' }
          flutter doctor -v

      - name: Generate Windows runner
        run: |
          $ErrorActionPreference = 'Stop'
          flutter config --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enable Windows desktop.' }
          if (-not (Test-Path windows/CMakeLists.txt)) {
            flutter create --platforms=windows --project-name course_helper --no-pub .
            if ($LASTEXITCODE -ne 0) { throw 'Cannot generate Windows runner.' }
          }


      - name: Prepare Windows startup compatibility and smoke test
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = (Get-Location).Path
          function Replace-RequiredSource {
            param([string]$RelativePath, [string]$Before, [string]$After)
            $target = Join-Path $repoRoot $RelativePath
            $text = [IO.File]::ReadAllText($target)
            if (-not $text.Contains($Before)) {
              throw "The pinned source fragment was not found in $RelativePath."
            }
            [IO.File]::WriteAllText($target, $text.Replace($Before, $After), [Text.UTF8Encoding]::new($false))
          }
          
          $imStartup = @'
            if (Platform.isWindows) {
              logger.w('The mobile IM SDK is unavailable on Windows.');
            } else {
              await EasemobIM().initialize();
            }
          '@
          Replace-RequiredSource 'lib/main.dart' '  await EasemobIM().initialize();' $imStartup
          
          $windowsNotifications = @'
          settings: InitializationSettings(
                  android: androidSettings,
                  iOS: iosSettings,
                  windows: WindowsInitializationSettings(
                    appName: '课程助手',
                    appUserModelId: 'com.anerycoft.course_helper',
                    guid: '8b6e172b-8524-43c6-9959-f4a83cbaf57b',
                  ),
                ),
          '@
          Replace-RequiredSource 'lib/push/notification.dart' 'settings: const InitializationSettings(android: androidSettings, iOS: iosSettings),' $windowsNotifications
          
          $testDependency = "dev_dependencies:" + [Environment]::NewLine + "  integration_test:" + [Environment]::NewLine + "    sdk: flutter"
          Replace-RequiredSource 'pubspec.yaml' 'dev_dependencies:' $testDependency
          
          $smokeTest = @'
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:integration_test/integration_test.dart';
          import 'package:course_helper/main.dart' as app;
          import 'package:course_helper/pages/accounts.dart';
          
          void main() {
            IntegrationTestWidgetsFlutterBinding.ensureInitialized();
          
            testWidgets('Windows starts and opens account management', (tester) async {
              final originalErrorHandler = FlutterError.onError;
              addTearDown(() {
                FlutterError.onError = originalErrorHandler;
              });
          
              // The upstream async entry point has a void return type.
              await (app.main as dynamic)();
              FlutterError.onError = originalErrorHandler;
              await tester.pumpAndSettle(
                const Duration(milliseconds: 100),
                EnginePhase.sendSemanticsUpdate,
                const Duration(seconds: 30),
              );
              expect(find.byType(app.MyApp), findsOneWidget);
              expect(find.byType(BottomNavigationBar), findsOneWidget);
          
              final cancel = find.widgetWithText(TextButton, '取消');
              if (cancel.evaluate().isNotEmpty) {
                await tester.tap(cancel.first);
                await tester.pumpAndSettle();
              }
          
              await tester.tap(find.byIcon(Icons.account_circle));
              await tester.pumpAndSettle();
              final navigation = tester.widget<BottomNavigationBar>(
                find.byType(BottomNavigationBar),
              );
              expect(navigation.currentIndex, 1);
              expect(find.byType(AccountsPage), findsOneWidget);
              expect(tester.takeException(), isNull);
          
              await tester.pumpWidget(const SizedBox.shrink());
              await tester.pumpAndSettle();
            });
          }
          '@
          $testDirectory = Join-Path $repoRoot 'integration_test'
          [IO.Directory]::CreateDirectory($testDirectory) | Out-Null
          [IO.File]::WriteAllText((Join-Path $testDirectory 'windows_smoke_test.dart'), $smokeTest, [Text.UTF8Encoding]::new($false))
          Write-Host 'Prepared Windows notification settings, mobile IM guard, and desktop startup check.'
          

      - name: Resolve dependencies
        run: |
          flutter pub get 2>&1 | Tee-Object ../dependency-resolution.log
          if ($LASTEXITCODE -ne 0) { throw 'Dependency resolution failed.' }

      - name: Verify Windows startup and account navigation
        timeout-minutes: 8
        run: |
          flutter test integration_test/windows_smoke_test.dart -d windows --reporter expanded 2>&1 | Tee-Object ../windows-startup-test.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows startup verification failed.' }

      - name: Compile Windows release
        run: |
          flutter build windows --release 2>&1 | Tee-Object ../windows-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows release compilation failed.' }

      - name: Package complete application and matching source
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'build/windows/x64/runner/Release'
          if (-not (Test-Path "$release/course_helper.exe")) {
            throw 'The expected Windows executable is missing.'
          }
          if (-not (Test-Path "$release/flutter_windows.dll")) {
            throw 'The Flutter runtime is missing.'
          }
          if (-not (Test-Path "$release/data")) {
            throw 'The application data directory is missing.'
          }
          New-Item -ItemType Directory ../output -Force | Out-Null
          Copy-Item LICENSE "$release/LICENSE.txt"
          Copy-Item ../source-commit.txt "$release/source-commit.txt"
          Compress-Archive -Path "$release/*" -DestinationPath ../output/CourseHelper-Windows-x64.zip
          tar.exe --exclude=.git --exclude=.dart_tool --exclude=build --exclude=windows/flutter/ephemeral -czf ../output/CourseHelper-Corresponding-Source.tar.gz .
          if ($LASTEXITCODE -ne 0) { throw 'Source archive creation failed.' }
          Get-FileHash ../output/* -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) } |
            Set-Content ../output/SHA256SUMS.txt

      - name: Upload Windows application and source
        uses: actions/upload-artifact@v4
        with:
          name: CourseHelper-Windows-x64
          path: output/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CourseHelper-Windows-build-diagnostics
          path: |
            dependency-resolution.log
            windows-build.log
            windows-startup-test.log
            source-commit.txt
          if-no-files-found: warn
          retention-days: 14
